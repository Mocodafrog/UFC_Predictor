name: Upload UFC Data to SQL Server

on:
  workflow_run:
    workflows: ["UFC Prediction Pipeline"]  
    types:
      - completed

jobs:
  load-csv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyodbc

    - name: Debug Environment Variables
      run: |
        set -x  # Habilita debug
        echo "DB_SERVER=${{ secrets.DB_SERVER }}"
        echo "DB_NAME=${{ secrets.DB_NAME }}"
        echo "DB_USER=${{ secrets.DB_USER }}"
        echo "CSV File exists:"
        ls -l data/

    - name: Load CSV to SQL Server
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        python upload_to_sql.py "data/fight_stats.csv" "fight_stats"
