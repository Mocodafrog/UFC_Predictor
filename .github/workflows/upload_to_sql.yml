name: Upload UFC Data to SQL Server

# Ejecutar esta acción después de que el pipeline de predicción haya terminado
on:
  workflow_run:
    workflows: ["UFC Prediction Pipeline"]  # Nombre del workflow del pipeline
    types:
      - completed

jobs:
  upload-to-sql:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v2

      # Paso 2: Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      # Paso 3: Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy pymysql

      # Paso 4: Ejecutar el script para subir datos a SQL
      - name: Upload data to SQL
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python upload_to_sql.py
