name: Upload UFC Data to SQL Server

# Ejecutar esta acción después de que el pipeline de predicción haya terminado
on:
  workflow_run:
    workflows: ["UFC Prediction Pipeline"]  # Nombre del workflow del pipeline
    types:
      - completed

jobs:
  load-csv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyodbc

    - name: Load CSV to SQL Server
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}  # Endpoint de tu instancia RDS
        DB_NAME: ${{ secrets.DB_NAME }}      # Nombre de la base de datos
        DB_USER: ${{ secrets.DB_USER }}      # Usuario de la base de datos
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}  # Contraseña de la base de datos
      run: |
        python upload_to_sql.py data/fight_stats.csv ufc
