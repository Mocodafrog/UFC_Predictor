name: UFC Prediction Pipeline

on:
  schedule:
    - cron: "0 7 * * 2"  # Ejecutar a las 7 AM UTC cada martes
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.12.4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run UFC pipeline
      run: |
        python UFC_Pipeline.py

    - name: Configurar git para commit
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/ models/
        git commit -m "Actualización semanal de modelos y datos" || echo "No hay cambios para commitear."

    - name: Subir cambios al repositorio
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Mocodafrog/UFC_Predictor.git HEAD:main || echo "No hay cambios para subir."
